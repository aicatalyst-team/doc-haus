# doc.haus fork CI. Runs on GitHub-hosted runners (the upstream `test` /
# `pr-management` / `pr-standards` workflows pin self-hosted Blacksmith runners
# this fork does not have, and pr-standards reads a `dev` branch that does not
# exist here, so they are disabled at the repo level). This file is fork-only —
# upstream has no workflow by this name, so it never conflicts on `git merge
# upstream/dev`.
#
# It exercises the tracked, installable doc.haus surface. apps/web is the only
# such piece: dochaus/ ships a gitignored package.json (its docxodus dep is
# installed at deploy time, not committed) and services/ingest has no build or
# typecheck target, so neither can be checked in a clean clone.
#
# apps/web imports the OpenCode SDK from packages/sdk/js by source, so its vite
# build resolves that package's tsconfig-extends chain (@tsconfig/node22, etc.).
# That requires a workspace-root install, not an apps/web-local one.
name: dochaus-ci

on:
  pull_request:
  push:
    branches: [dochaus]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-build:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Root install provides the workspace packages apps/web imports by source
      # (packages/sdk/js) and the @tsconfig/* bases their tsconfigs extend.
      # apps/web is not a workspace member, so its own deps (vite, react) need a
      # separate install.
      # --frozen-lockfile installs the committed, already-resolved versions and
      # skips re-resolution. That avoids bunfig's minimumReleaseAge filter, which
      # on a cold CI cache drops valid pins ("No version matching X (but package
      # exists)") when full publish-time manifests aren't available.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install web app dependencies
        run: bun install --cwd apps/web --frozen-lockfile

      - name: Build web app
        run: bun run --cwd apps/web build
